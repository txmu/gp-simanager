    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f3f4f6;
        transition: background-color 0.5s, color 0.5s;
        min-height: 100vh;
      }

      /* Sakura Theme */
      body.theme-sakura {
        background-color: #fff0f5;
        --theme-primary: #ec4899;
      }
      .sakura-petal {
        position: fixed;
        top: -10%;
        background-color: #ffc0cb;
        width: 10px;
        height: 10px;
        border-radius: 10px 0;
        z-index: 0;
        animation: fall linear infinite;
        opacity: 0.6;
        pointer-events: none;
      }
      @keyframes fall {
        0% { transform: translateY(-10vh) rotate(0deg) translateX(0px); opacity: 0; }
        20% { opacity: 0.8; }
        100% { transform: translateY(110vh) rotate(360deg) translateX(50px); opacity: 0; }
      }

      /* Snow Theme */
      body.theme-snow {
        background-color: #bae6fd;
        background-image: linear-gradient(180deg, #7dd3fc 0%, #bfdbfe 100%);
        --theme-primary: #0ea5e9;
      }
      .snowflake {
        position: fixed;
        top: -10%;
        color: #fff;
        text-shadow: 0 0 5px #bae6fd;
        z-index: 0;
        animation: snow-fall linear infinite;
        pointer-events: none;
        opacity: 0.8;
      }
      @keyframes snow-fall {
        0% { transform: translateY(-10vh) translateX(0); opacity: 0; }
        20% { opacity: 0.9; }
        100% { transform: translateY(110vh) translateX(20px); opacity: 0.2; }
      }

      /* Matcha Theme */
      body.theme-matcha {
        background-color: #f0fdf4;
        --theme-primary: #16a34a;
      }

      /* Geek Theme */
      body.theme-geek {
        background-color: #0d1117;
        color: #3fb950;
        font-family: 'JetBrains Mono', monospace;
        --theme-primary: #2ea043;
      }
      body.theme-geek .bg-white {
        background-color: #161b22 !important;
        border-color: #30363d !important;
        color: #c9d1d9 !important;
      }
      body.theme-geek .text-gray-900 { color: #f0f6fc !important; }
      body.theme-geek .text-gray-800 { color: #c9d1d9 !important; }
      body.theme-geek .text-gray-700 { color: #8b949e !important; }
      body.theme-geek .text-gray-600 { color: #8b949e !important; }
      body.theme-geek .text-gray-500 { color: #6e7681 !important; }
      body.theme-geek .text-gray-400 { color: #484f58 !important; }
      body.theme-geek .bg-gray-50 { background-color: #0d1117 !important; border-color: #30363d !important; }
      body.theme-geek .bg-gray-100 { background-color: #21262d !important; }
      body.theme-geek input, body.theme-geek select, body.theme-geek textarea {
        background-color: #0d1117 !important;
        color: #c9d1d9 !important;
        border-color: #30363d !important;
      }
      body.theme-geek .border-gray-200 { border-color: #30363d !important; }
      body.theme-geek .border-gray-100 { border-color: #21262d !important; }
      body.theme-geek header {
        background-color: #161b22e6 !important;
        border-bottom-color: #30363d !important;
      }

      .path-anim {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: dash 2s linear forwards;
      }
      @keyframes dash { to { stroke-dashoffset: 0; } }
      
      @keyframes shake {
        10%, 90% { transform: translate3d(-1px, 0, 0); }
        20%, 80% { transform: translate3d(2px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
        40%, 60% { transform: translate3d(4px, 0, 0); }
      }
      .animate-shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
      .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* 自定义滚动条 */
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
      body.theme-geek .custom-scrollbar::-webkit-scrollbar-thumb { background: #30363d; }
    </style>

    <!-- Service Worker 注册与自动更新逻辑 -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            console.log('SW 注册成功，作用域为:', registration.scope);

            // 每当页面加载时主动检查 sw.js 文件是否有更新
            registration.update();

            // 监听发现新版本 Service Worker 的事件
            registration.onupdatefound = () => {
              const installingWorker = registration.installing;
              if (installingWorker == null) return;

              installingWorker.onstatechange = () => {
                if (installingWorker.state === 'installed') {
                  if (navigator.serviceWorker.controller) {
                    // 此时已经有旧的 SW 在控制页面，且新的 SW 已安装完毕
                    // 触发刷新以应用新版本
                    console.log('检测到新版本代码，正在自动刷新更新...');
                    setTimeout(() => {
                        window.location.reload();
                    }, 800);
                  }
                }
              };
            };
          }).catch((error) => {
            console.error('Service Worker 注册失败:', error);
          });
        });

        // 核心更新逻辑：当新的 Service Worker 激活并接管页面时，强制刷新
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      }
    </script>
